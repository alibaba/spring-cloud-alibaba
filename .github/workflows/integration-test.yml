name: Integration Testing
on:
  push:
    branches:
      - 2023.x
      - 2025.0.x
      - 2025.1.x
      - xuxiaowei/*
  pull_request:
    branches:
      - 2023.x
      - 2025.0.x
      - 2025.1.x
jobs:
  deploy-docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

  integration-testing:
    name: Integration Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Dependies Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Compile & Checkstyle
        run: mvn clean compile
      - name: install dependencies
        run: mvn clean install -U package -pl '!spring-cloud-alibaba-coverage'  -DskipTests
      - name: Testing
        run: ./mvnw verify -B -Dmaven.test.skip=false
#        run: mvn clean -Dit.enabled=true test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: integration-testing
    if: (github.repository_owner == 'alibaba' || github.repository_owner == 'xuxiaowei-com-cn') && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Dependies Cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Modify GroupId
        if: github.repository_owner == 'xuxiaowei-com-cn'
        run: |
          find . -name "pom.xml" -type f -exec sed -i 's#<groupId>com.alibaba.cloud</groupId>#<groupId>io.xuxiaowei.alibaba.cloud</groupId>#g' {} \;
      - name: install dependencies
        run: mvn clean install -U package -pl '!spring-cloud-alibaba-coverage'  -DskipTests
      - name: Deploy to Maven Central
        run: |
          echo "${{ secrets.GPG_SECRET_KEYS }}" | gpg --import
          mvn clean -B deploy -DskipTests -Prelease -s settings.xml
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
